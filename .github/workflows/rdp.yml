name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Enable RDP + Create User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          net user dzaycrazy $env:RDP_PASSWORD /add
          net localgroup Administrators dzaycrazy /add
          net localgroup "Remote Desktop Users" dzaycrazy /add

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-rdp

      - name: Keep alive
        run: |
          Write-Host "RDP: $(tailscale ip -4)  |  user: dzaycrazy"
          Start-Sleep -Seconds 7000
